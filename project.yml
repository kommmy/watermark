name: Markit

options:
  bundleIdPrefix: com.kommmy
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES

targets:
  Markit:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Markit/App
      - path: Markit/Theme
      - path: Markit/Models
      - path: Markit/Services
      - path: Markit/Templates
      - path: Markit/PuzzleLayouts
      - path: Markit/Views
      - path: Markit/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kommmy.markit
        INFOPLIST_FILE: Markit/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
