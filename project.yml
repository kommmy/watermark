name: WatermarkCamera

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES

targets:
  WatermarkCamera:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WatermarkCamera/App
      - path: WatermarkCamera/Models
      - path: WatermarkCamera/Services
      - path: WatermarkCamera/Templates
      - path: WatermarkCamera/Views
      - path: WatermarkCamera/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.WatermarkCamera
        INFOPLIST_FILE: WatermarkCamera/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
