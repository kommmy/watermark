<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>markit 支持</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; color: #202322; background: #fbf7ee; }
    main { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; line-height: 1.75; }
    h1 { font-size: 36px; line-height: 1.15; margin: 0 0 12px; }
    h2 { font-size: 22px; margin: 36px 0 8px; }
    p, li { color: #555954; }
    a { color: #207f7b; }
  </style>
</head>
<body>
  <main>
    <h1>markit 支持</h1>
    <p>如果你在使用 markit 时遇到问题，可以先尝试更新到最新版本，并确认已经允许 App 读取照片和保存到相册。</p>

    <h2>常见问题</h2>
    <ul>
      <li>无法读取照片：请换一张图片测试，或检查系统照片权限。</li>
      <li>水印参数缺失：部分图片没有完整 EXIF，进入编辑页后可以手动填写。</li>
      <li>保存失败：请确认已经允许 markit 添加照片到相册。</li>
    </ul>

    <h2>反馈问题</h2>
    <p>请在 <a href="https://github.com/kommmy/watermark/issues">GitHub Issues</a> 留下问题描述、设备型号、iOS 版本和复现步骤。</p>

    <p><a href="./privacy.html">查看隐私政策</a></p>
  </main>
</body>
</html>
