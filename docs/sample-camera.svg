  </defs>

  <rect width="800" height="600" fill="#ffffff"/>

  <!-- Camera body -->
  <rect x="180" y="220" width="440" height="220" rx="16" fill="url(#bodyTop)"/>
  <rect x="180" y="380" width="440" height="60" rx="0 0 16 16" fill="url(#bodyBottom)"/>

  <!-- Grip bump -->
  <rect x="180" y="220" width="60" height="220" rx="20" fill="#0e0e0e"/>

  <!-- Top hot shoe + dials -->
  <rect x="260" y="200" width="60" height="22" rx="2" fill="#1a1a1a"/>
  <circle cx="380" cy="206" r="14" fill="#1a1a1a"/>
  <circle cx="380" cy="206" r="8" fill="#444"/>
  <rect x="520" y="190" width="80" height="32" rx="4" fill="#1a1a1a"/>

