name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project WatermarkCamera.xcodeproj

      - name: Show available simulators
        run: xcrun simctl list devices available iOS | head -40

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project WatermarkCamera.xcodeproj \
            -scheme WatermarkCamera \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload built .app (for inspection)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkCamera-Simulator
          path: build/Build/Products/Debug-iphonesimulator/WatermarkCamera.app
          if-no-files-found: error
          retention-days: 7
