name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p
          ls /Applications/ | grep -i xcode || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # XcodeGen 2.x 默认生成 objectVersion = 77（Xcode 16 格式）。
          # 如果 runner 用的是更老的 Xcode，会打不开。保险起见把它降到 60（Xcode 15 OK，Xcode 16 也能向下兼容）。
          sed -i.bak 's/objectVersion = 77;/objectVersion = 60;/' Markit.xcodeproj/project.pbxproj
          echo "Final objectVersion:"
          grep "objectVersion" Markit.xcodeproj/project.pbxproj | head -1

      - name: Build with verbose output
        run: |
          set +e
          set -o pipefail

          echo "::group::Project file listing"
          ls -la Markit.xcodeproj/ || true
          echo "::endgroup::"

          echo "::group::xcodebuild -list"
          xcodebuild -list -project Markit.xcodeproj 2>&1 | tee list.log
          LIST_RC=${PIPESTATUS[0]}
          echo "::endgroup::"

          if [ "$LIST_RC" -ne 0 ]; then
            echo "::error::xcodebuild -list failed with exit code $LIST_RC"
            tail -30 list.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit "$LIST_RC"
          fi

          echo "::group::xcodebuild build"
          xcodebuild \
            -project Markit.xcodeproj \
            -scheme Markit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "::endgroup::"

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "::error::xcodebuild build failed with exit code $BUILD_RC"
            grep -E '(error:|warning:|note:)' xcodebuild.log | head -60 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit "$BUILD_RC"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            list.log
            Markit.xcodeproj/project.pbxproj
            build/Build/Products/Debug-iphonesimulator/Markit.app
          if-no-files-found: warn
          retention-days: 7
